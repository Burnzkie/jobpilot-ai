version: "3.9"

services:

  backend:

    build: .

    container_name: jobpilot-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    restart: unless-stopped

  postgres:

    image: postgres:16

    container_name: jobpilot-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:

  postgres-data: